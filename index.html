<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>PWA_Mensajero</title>
        <!-- Add icon library -->
        <link rel="manifest" href="./manifest.json" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <!-- Cabecera -->
        <header class="header">
            <button id="toggle-menu-btn" class="nav-btn"><i class="fa-solid fa-bars"></i>_MENÚ</button>

            <div class="logo">Mensajero</div>
            <div class="system-status">SYS_STATUS: ONLINE [98%]</div>
            <button id="install-btn" class="nav-btn" style="display: none">_INSTALAR_PWA</button>
        </header>

        <div class="dashboard-container">
            <div data-include="components/sidebar.html"></div>
            <div data-include="modal/cerrar-session.html"></div>

            <!-- Contenido Central -->
            <main class="main-content" id="main-content">
                <div data-include="views/submenu-ruta/rutas-activas.html"></div>
                <div data-include="views/submenu-ruta/rutas-en-espera.html"></div>
                <div data-include="views/submenu-ruta/cargar-offline.html"></div>

                
                <div data-include="views/submenu-monedero/saldo.html"></div>
                <div data-include="views/submenu-monedero/transacciones.html"></div>

                <div data-include="views/notificaciones/coordi-bodega.html"></div>
                <div data-include="views/notificaciones/sobre-ruta.html"></div>

                <div data-include="views/perfil/mi-moto.html"></div>
                <div data-include="views/perfil/mis-datos.html"></div>

                <div data-include="views/config.html"></div>
            </main>
        </div>
        <script src="./app.js"></script>
        <script src="./script.js"></script>
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("./sw.js")
                        .then((reg) => console.log("Service Worker registrado con éxito:", reg))
                        .catch((err) => console.error("Error al registrar el Service Worker:", err));
                });
            }
        </script>
    </body>
</html>
